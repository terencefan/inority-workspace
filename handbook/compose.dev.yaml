services:
  handbook:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: handbook-dev:local
    container_name: handbook-dev
    working_dir: /workspace/inority-workspace/handbook
    # node_modules lives in named volumes so host-side `npm ci`/`npm prune`
    # (handbook-deploy) cannot break the running dev stack. The bootstrap
    # install runs offline against the host npm cache (mounted below);
    # container egress cannot reach npm registries.
    command:
      - sh
      - -c
      - |
        if [ ! -x /workspace/inority-workspace/node_modules/.bin/vite ]; then
          npm ci --no-audit --no-fund --prefer-offline --cache /npm-cache
        fi
        exec npm run dev
    environment:
      HANDBOOK_DEV_BACKEND: http://127.0.0.1:18081
      HANDBOOK_GRAPHVIZ_COMMAND: dot
      HANDBOOK_HOST: 127.0.0.1
      HANDBOOK_PORT: 18081
      HANDBOOK_RG_COMMAND: /usr/local/bin/rg
      HANDBOOK_WORKSPACE_DIR: /workspace
      NODE_ENV: development
      NODE_OPTIONS: --experimental-strip-types
    restart: unless-stopped
    volumes:
      - /home/fantengyuan/workspace:/workspace
      - /home/fantengyuan/.npm:/npm-cache
      - handbook_workspace_modules:/workspace/inority-workspace/node_modules
      - handbook_modules:/workspace/inority-workspace/handbook/node_modules
      - /home/fantengyuan/.npm-global/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path/rg:/usr/local/bin/rg:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/healthz').then(r=>{if(!r.ok)throw Error(r.status)})
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  edge:
    image: nginx:1.27-alpine
    container_name: handbook-edge
    depends_on:
      handbook:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8081/healthz >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  handbook_workspace_modules:
  handbook_modules:
