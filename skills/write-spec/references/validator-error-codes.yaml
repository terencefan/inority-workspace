E000:
  message: "目标 spec 文件不存在：{path}"
E001:
  message: "首行必须是 spec 标题"
E002:
  message: "spec 标题必须以“设计文档”结尾"
E003:
  message: "spec 文件名必须以“-spec.md”结尾"
E004:
  message: "H1 下的第一个非空块必须是 GitHub 风格的 `> [!NOTE]` spec 类型说明"
E005:
  message: "spec 类型只能是：产品向 spec / 技术向 spec / llm 节点 spec"
E006:
  message: "llm 节点 spec 在“Prompt 设计”下必须显式包含：system prompt / user prompt"
E007:
  message: "llm 节点 spec 的“Prompt 设计 -> user prompt”章节必须包含 fenced `dot` 或 `graphviz` 图，用来说明 user prompt 的生产过程"
E010:
  message: "内容级二级标题必须严格按当前 spec 类型的默认顺序收敛为：{expected}"
E011:
  message: "“背景与现状”下的三级标题必须且只能是：背景 / 现状"
E013:
  message: "“风险与红线”下的三级标题必须且只能是：风险 / 红线行为"
E014:
  message: "“红线行为”下的具体条目必须使用 GitHub 风格的 `> [!CAUTION]` callout"
E020:
  message: "“现状”三级小节必须包含 fenced `dot` 或 `graphviz` 图"
E021:
  message: "“目标”三级小节必须包含 fenced `dot` 或 `graphviz` 图"
E022:
  message: "“架构总览”二级小节必须包含 fenced `dot` 或 `graphviz` 图"
E030:
  message: "“访谈记录”必须至少保留 5 轮真实用户问答"
E031:
  message: "访谈问题行必须写成 `> Q：...`"
E032:
  message: "访谈记录里 `Q` 和 `A` 之间必须保留空 quote 行"
E033:
  message: "访谈回答行必须写成 `> A：...`"
E034:
  message: "每轮访谈后都必须补 `收敛影响：...`"
E039:
  message: "A：... 不能只写“选项 1/2/3”或裸 `1/A/B` 这类脱离上下文的简写"
E040:
  message: "“方案对比”必须至少包含一个三级标题，每个三级标题表示一组对比"
E041:
  message: "“方案对比”下每组对比都必须包含 GitHub Note 风格的 `> 对比结论：...`"
E049:
  message: "Q：... 只允许写题干，不允许内联候选选项或 1/2/3 这类编号列表"
